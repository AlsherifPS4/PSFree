<html manifest="psfree_lapse.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alsherif Store | Installing Offline Cache</title>
<link rel="shortcut icon" href="favicon.ico">
<style>
*{box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;background-image:linear-gradient(rgba(0,5,18,.24),rgba(0,5,18,.30)),url("bg.png");background-repeat:no-repeat,no-repeat;background-size:100% 100%,contain;background-position:center center,center center;background-color:#020817;color:white;font-size:20px;text-align:center;font-family:Arial,Helvetica,sans-serif;}
.info{box-sizing:border-box;width:min(90vw,760px);padding:18px 26px;font-size:clamp(18px,2.2vw,26px);font-family:Arial,Helvetica,sans-serif;color:white;text-shadow:0 2px 6px #000;background:rgba(0,5,18,.82);border:1px solid #078bff;border-radius:14px;box-shadow:0 0 28px rgba(0,115,255,.4);}
</style>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){var percent=e.total?Math.round(e.loaded/e.total*100):0;document.getElementById('msgs').textContent='Installing offline cache ... '+percent+'%';}
function DisplayCacheProgress(){setTimeout(function(){document.getElementById('msgs').textContent='Cache installed successfully';},1000);setTimeout(function(){location.reload();},2500);}
if(window.applicationCache){window.applicationCache.addEventListener('progress',DLProgress,false);window.applicationCache.addEventListener('cached',DisplayCacheProgress,false);window.applicationCache.addEventListener('updateready',DisplayCacheProgress,false);}
</script>
</head>
<body>
<div id="msgs" class="info" role="status" aria-live="polite">Preparing offline cache ...</div>
</body>
</html>
